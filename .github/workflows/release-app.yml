name: Release do app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão SemVer do app (exemplo: 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-app-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Validar e publicar app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: app-v${{ inputs.version }}
      ARTIFACT_NAME: proviziona-app-${{ inputs.version }}.zip
      CHECKSUM_NAME: proviziona-app-${{ inputs.version }}.zip.sha256
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar origem e disponibilidade da versão
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "A release deve ser executada a partir da branch $DEFAULT_BRANCH."
            exit 1
          fi

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          tag_status=$?
          set -e

          case "$tag_status" in
            0)
              echo "A tag $RELEASE_TAG já existe."
              exit 1
              ;;
            2)
              ;;
            *)
              echo "Não foi possível verificar a existência da tag $RELEASE_TAG."
              exit "$tag_status"
              ;;
          esac

          set +e
          release_check="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1
          )"
          release_status=$?
          set -e

          if [[ "$release_status" -eq 0 ]]; then
            echo "A release $RELEASE_TAG já existe."
            exit 1
          fi

          if [[ "$release_check" != *"HTTP 404"* ]]; then
            echo "Não foi possível verificar a existência da release $RELEASE_TAG."
            echo "$release_check"
            exit "$release_status"
          fi

      - name: Validar versão e executar verificações
        run: |
          docker run --rm \
            --env RELEASE_VERSION \
            --volume "${{ github.workspace }}/app:/app" \
            --workdir /app \
            node:22-bookworm-slim \
            sh -euc '
              node -e '\''
                const fs = require("node:fs");
                const version = process.env.RELEASE_VERSION;
                const semver = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
                const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));

                if (!semver.test(version)) {
                  console.error(`Versão inválida: ${version}. Use o formato X.Y.Z.`);
                  process.exit(1);
                }

                if (packageJson.version !== version) {
                  console.error(
                    `A versão informada (${version}) difere de app/package.json (${packageJson.version}).`,
                  );
                  process.exit(1);
                }
              '\''
              npm ci
              npm run check
            '

      - name: Empacotar distribuição e gerar checksum
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/release-app"

          docker run --rm \
            --env ARTIFACT_NAME \
            --env CHECKSUM_NAME \
            --volume "${{ github.workspace }}/app/dist:/dist:ro" \
            --volume "${{ runner.temp }}/release-app:/artifacts" \
            --workdir /dist \
            alpine:3.22 \
            sh -euc '
              apk add --no-cache zip
              zip -qr "/artifacts/$ARTIFACT_NAME" .
              cd /artifacts
              sha256sum "$ARTIFACT_NAME" > "$CHECKSUM_NAME"
            '

      - name: Criar tag e GitHub Release
        run: |
          gh release create "$RELEASE_TAG" \
            "${{ runner.temp }}/release-app/$ARTIFACT_NAME" \
            "${{ runner.temp }}/release-app/$CHECKSUM_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Proviziona App v$RELEASE_VERSION" \
            --generate-notes
