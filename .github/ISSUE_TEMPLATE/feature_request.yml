name: Sugerir uma melhoria
description: Proponha uma solução para um problema real de uso.
title: "[Ideia]: "
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Verificação
      options:
        - label: Procurei por issues existentes sobre a mesma necessidade.
          required: true
  - type: textarea
    attributes:
      label: Problema
      description: Que dificuldade existe hoje? Dê um exemplo concreto.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Solução proposta
      description: Como você imagina que o Proviziona poderia resolver isso?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternativas consideradas
  - type: textarea
    attributes:
      label: Impacto em local-first e self-host
      description: A proposta depende de internet, da nuvem oficial ou de algum serviço externo?
